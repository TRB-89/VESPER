[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vesper"
version = "2.1.0"
description = "VESPER v2.1 - Indian Equities Quantitative Research Project (Phase 00 Data Provider Spike)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "duckdb==2.0.0",
    "requests==2.34.2",
    "yfinance==1.8.0",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
